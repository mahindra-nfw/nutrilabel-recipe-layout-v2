<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriLabel Recipe Builder</title>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="cards.css">
</head>
<body data-layout="cards">
  <header class="topbar">
    <span class="brand">NutriLabel <small>Recipe Builder</small></span>
    <span class="title" id="recipeTitle"></span>
    <div class="view-seg" id="viewSeg" title="Switch between the board and a top-to-bottom sheet of the same recipe"><button data-view="board" class="on">⊞ Board</button><button data-view="sheet">☰ Sheet</button></div>
    <span class="spacer"></span>
    <button class="btn ghost" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn ghost" id="redo" title="Redo (Ctrl+Y)">↷</button>
    <button class="btn" id="arrange">⇶ Auto-arrange</button>
    <button class="btn" id="fit">⤢ Fit</button>
    <button class="btn" id="toggleNut">Nutrition ▸</button>
    <button class="btn" id="addCard" title="Add an unconnected card to this recipe">＋ Add card</button>
    <button class="btn" id="pasteCard" hidden>📋 Paste card</button>
    <button class="btn" id="compare" title="Compare recipes and versions side by side">⇄ Compare</button>
    <button class="btn primary" id="newRecipe">＋ New recipe</button>
    <button class="btn" id="newVer">⎘ New Version</button>
    <!-- TEMP: reset-to-sample button (remove this line and the #resetSample handler in cards.js) -->
    <button class="btn ghost" id="resetSample" title="Replace this tab with the original sample recipe (undo with Ctrl+Z)">↺ Reset</button>
  </header>
  <main class="cmain" id="cmain">
    <aside class="side">
      <div class="side-block">
        <div class="side-h">Recipe structure</div>
        <div id="tree"></div>
      </div>
      <div class="side-block grow">
        <div class="side-h">Ingredient library</div>
        <input class="txt" id="libSearch" placeholder="Search, then drag onto a card…">
        <button class="btn new-ing-btn" id="newIng">＋ New ingredient</button>
        <div id="lib" class="lib"></div>
      </div>
    </aside>
    <section class="canvas" id="vp">
      <div class="empty-hint" id="emptyHint" hidden>
        <b>Blank recipe</b>
        <span>Start with any card: a sub-recipe (a sauce, a broth) or the final dish. Use the <i>Final / Sub-recipe</i> switch on each card, and link cards by dragging their ● handle.</span>
        <button class="btn primary" data-emptyadd>＋ Add card</button>
      </div>
      <div class="world" id="world">
        <svg class="links" id="links"></svg>
        <div id="cards"></div>
      </div>
      <div class="zoombar">
        <button id="zout">−</button><span class="zl" id="zl">100%</span><button id="zin">+</button>
      </div>
    </section>
    <section class="sheetview" id="sheetView">
      <div class="sv-bar">
        <span class="sv-lab">Links</span>
        <div class="sv-seg"><button data-svlinks="jump">Jump links</button><button data-svlinks="indent">Indent + rail</button><button data-svlinks="lines">Lines</button></div>
        <span class="sv-lab">Width</span>
        <div class="sv-seg"><button data-svwidth="full">Full width</button><button data-svwidth="card">Card width</button></div>
        <span class="sv-hint">Drag ⠿ or use ↑ ↓ to reorder cards</span>
      </div>
      <div class="sv-inner" id="svInner"><svg class="links" id="svLinks"></svg><div id="svCards"></div></div>
    </section>
    <aside class="nut" id="nut"></aside>
  </main>
  <script src="shared/data.js"></script>
  <script src="shared/engine.js"></script>
  <script src="cards.js"></script>
</body>
</html>
